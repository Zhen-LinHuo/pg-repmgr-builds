# pg-repmgr-builds — CI
#
# Three artifacts:
#   1. glibc/dynamic repmgr binary  (GNU Guix build)
#   2. fully static repmgr binary   (GNU Guix build)
#   3. PostgreSQL 16 + repmgr image  (docker build -> GHCR)
#
# The Guix jobs run on ubuntu-latest with Guix installed (the "install Guix in
# an ubuntu image" approach), then build the two flavours from pkgs/ and upload
# them as release assets. The image job builds docker/postgresql-repmgr.Dockerfile
# and pushes to GHCR tagged <PGVERSION> plus a moving "16" alias.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up new PostgreSQL 16.x point releases + repmgr deps.
    - cron: "0 6 * * 1"

permissions:
  contents: write          # create releases / upload assets
  packages: write          # push to GHCR

env:
  # PostgreSQL major.minor to build the image against (the image tag).
  # GHCR requires lowercase repository names; GitHub owner logins are
  # case-preserving (e.g. "Zhen-LinHuo"), so fold the owner to lowercase.
  PG_VERSION: "16.15"

jobs:
  # ---------------------------------------------------------------------
  # 1 + 2: glibc and static repmgr binaries via GNU Guix
  # ---------------------------------------------------------------------
  binaries:
    name: repmgr (${{ matrix.flavour }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: glibc
            target: "(@ (pg-repmgr-builds repmgr) repmgr)"
          - flavour: static
            target: "(@ (pg-repmgr-builds repmgr) repmgr-static)"
    steps:
      - uses: actions/checkout@v4

      # The apt guix is 1.4.0 (2023) — far too old to know `postgresql-16`
      # (added Nov 2024), which makes the recipe fail with
      # `postgresql-16: unbound variable`. Use the official guix installer
      # action instead, which runs `guix pull` for a current guix.
      - name: Install GNU Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: true

      - name: Report guix version
        run: guix --version | head -1

      - name: Cache guix store
        uses: actions/cache@v4
        with:
          path: ~/guix-store-cache
          key: guix-${{ matrix.flavour }}-${{ hashFiles('pkgs/**/*.scm') }}

      - name: Build repmgr (${{ matrix.flavour }})
        run: |
          set -eux
          # Build from the local pkgs/ tree. `-L .` makes the module resolvable.
          guix build -L pkgs -e "${{ matrix.target }}" | tee /tmp/store-path.txt
          STORE_PATH="$(tail -n1 /tmp/store-path.txt)"
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          # Stage the binaries for upload.
          mkdir -p dist
          cp -a "${STORE_PATH}/bin/repmgr"     dist/repmgr-${{ matrix.flavour }}
          cp -a "${STORE_PATH}/bin/repmgrd"    dist/repmgrd-${{ matrix.flavour }}
          # Record how it is linked (evidence for the artifact).
          file dist/repmgr-${{ matrix.flavour }} | tee dist/repmgr-${{ matrix.flavour }}.file.txt

      - name: Verify static build is actually static
        if: matrix.flavour == 'static'
        run: |
          set -eux
          if ! file dist/repmgr-static | grep -qi "statically linked"; then
            echo "::error::repmgr-static is NOT statically linked"; file dist/repmgr-static; exit 1
          fi
          if ldd dist/repmgr-static 2>&1 | grep -qi "not a dynamic executable"; then
            echo "OK: ldd reports not a dynamic executable"
          else
            echo "::error::repmgr-static has dynamic deps"; ldd dist/repmgr-static; exit 1
          fi

      - name: Smoke test (repmgr --version)
        run: |
          set -eux
          ./dist/repmgr-${{ matrix.flavour }} --version
          ./dist/repmgrd-${{ matrix.flavour }} --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: repmgr-${{ matrix.flavour }}
          path: dist/*

  # ---------------------------------------------------------------------
  # 3: PostgreSQL 16 + repmgr image -> GHCR
  # ---------------------------------------------------------------------
  image:
    name: postgresql-repmgr image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # GHCR requires lowercase repository names; owner logins are
        # case-preserving (e.g. "Zhen-LinHuo"), so fold owner to lowercase.
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${OWNER}/postgresql-repmgr" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/postgresql-repmgr.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.PG_VERSION }}
            ${{ env.IMAGE }}:16
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ---------------------------------------------------------------------
  # Release: attach binaries to a tag when one is pushed
  # ---------------------------------------------------------------------
  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten and release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
